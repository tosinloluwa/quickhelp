<ion-header [translucent]="true">
</ion-header>

<ion-content [fullscreen]="true" class="ion-activatable" style="overflow: hidden;">
  <div class="landing-page" *ngIf="!isIframeActive">    
    <div class="avatar-container">
      <img src="/assets/avatar-nigerian.png" alt="Avatar" />
    </div>
    <ion-text class="welcome-message">Welcome to QuickHelp</ion-text>
    <ion-button color="primary" (click)="loadIframe()">Click here to start</ion-button>
    <ion-text *ngIf="!canConnect" class="offline-hint">Connecting</ion-text>
  </div>

  <div class="iframe-container" *ngIf="isIframeActive && !isOffline">
    <iframe
      #chatIframe
      title="QuickHelp"
      allow="encrypted-media; camera; microphone; fullscreen; payment; geolocation; clipboard-write; display-capture"
      src="https://quickhelp.com.ng/chat.php"
      style="width: 100%; height: 100%; border: none;"
      (load)="onIframeLoad()"
      (error)="onIframeError()"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-storage-access-by-user-activation"
    ></iframe>
    <div class="camo">QuickHelp</div>
  </div>

  <div class="loader-container" *ngIf="isOffline && isIframeActive">
    <ion-text class="offline-message">
      Kindly wait as I am trying to find a way to connect to the internet
    </ion-text>
    <ion-button color="primary" (click)="retryConnection()">Try Again</ion-button>
  </div>
</ion-content>
