<ion-header [translucent]="true"></ion-header>
<ion-content [fullscreen]="true">
  <div class="loader-container" *ngIf="isLoading || isOffline">
    <ion-spinner *ngIf="isLoading"></ion-spinner>
    <ion-text *ngIf="isOffline" class="offline-message">
      Kindly wait as I am trying to find a way to connect to the internet
    </ion-text>
    <ion-button *ngIf="isOffline" color="primary" (click)="retryConnection()">Try Again</ion-button>
  </div>
  <div class="iframe-container" *ngIf="isLoaded && !isOffline">
    <iframe
      title="QuickHelp"
      allow="encrypted-media; allow-same-origin; allow-scripts"
      src="https://quickhelp.com.ng/chat.php"
      style="width: 100%; height: 100%;"
    ></iframe>
    <div class="camo">QuickHelp</div>
  </div>
</ion-content>
