<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>QuickHelp</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <!-- Offline Landing Page -->
  <div class="offline-container" *ngIf="!isOnline">
    <ion-icon name="wifi-outline" class="offline-icon"></ion-icon>
    <h1>No Internet Connection</h1>
    <p>Please check your network settings and try again.</p>
    <ion-button color="primary" (click)="retryConnection()">Retry</ion-button>
  </div>

  <!-- Iframe with Spinner or Error -->
  <div class="iframe-container" *ngIf="isOnline">
    <ion-spinner *ngIf="isLoading"></ion-spinner>
    <ion-text *ngIf="errorMessage">{{ errorMessage }}</ion-text>
    <iframe
      title="QuickHelp"
      allow="encrypted-media; allow-same-origin; allow-scripts"
      src="https://quickhelp.com.ng/chat.php"
      style="width: 100%; height: 100%;"
      (load)="onIframeLoad()"
      (error)="onIframeError()"
    ></iframe>
  </div>
</ion-content>
