<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>QuickHelp</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeApp()">
        <ion-icon name="power-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <!-- Network Offline Page -->
  <div class="offline-container" *ngIf="!isOnline">
    <ion-icon name="wifi-outline" class="offline-icon"></ion-icon>
    <h1>No Internet Connection</h1>
    <p>Please check your network settings and try again.</p>
    <ion-button color="primary" (click)="retryConnection()">Retry</ion-button>
  </div>

  <!-- Website Offline Notice -->
  <div class="offline-container" *ngIf="isOnline && !isWebsiteAvailable">
    <ion-icon name="cloud-offline-outline" class="offline-icon"></ion-icon>
    <h1>Website Unavailable</h1>
    <p>The QuickHelp chat service is currently offline. Please try again later.</p>
    <ion-button color="primary" (click)="retryConnection()">Retry</ion-button>
  </div>

  <!-- Iframe with Spinner -->
  <div class="iframe-container" *ngIf="isOnline && isWebsiteAvailable">
    <ion-spinner *ngIf="isLoading"></ion-spinner>
    <ion-text *ngIf="errorMessage">{{ errorMessage }}</ion-text>
    <iframe
      title="QuickHelp"
      allow="encrypted-media; allow-same-origin; allow-scripts"
      src="https://quickhelp.com.ng/chat.php"
      style="width: 100%; height: 100%;"
      (load)="onIframeLoad()"
      (error)="onIframeError()"
    ></iframe>
  </div>
</ion-content>
